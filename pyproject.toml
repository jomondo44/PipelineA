[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "avatarpipe"
version = "0.1.0"
description = "CPU-only orchestrator: map an animated avatar onto video of yourself and composite it into a scene"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "PyYAML>=6.0",
  "mediapipe>=0.10.14",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
gui = ["gradio>=6.0"]

[project.scripts]
avatarpipe = "avatarpipe.cli:main"

[tool.setuptools.packages.find]
include = ["avatarpipe*"]

[tool.setuptools.package-data]
avatarpipe = ["blender/*.py", "templates/*.yaml"]
